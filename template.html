  /* ---- 로그인·가입 (Supabase) ---- */
  function initSupabase() {
    var qs = location.search + location.hash;
    var hadCode = /[?&]code=/.test(location.search);
    var errMatch = /error_code=([a-z_]+)/.exec(qs);
    try {
      sb = window.supabase.createClient(CFG.url, CFG.key, { auth: { flowType: "pkce", persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } });
    } catch (e) { sb = null; }
    if (errMatch) {
      setTimeout(function () { toast(errMatch[1] === "otp_expired" ? "링크가 만료됐거나 이미 사용됐어요. 다시 시도해 주세요." : "인증 링크를 처리하지 못했어요. 다시 시도해 주세요."); }, 300);
      try { history.replaceState(null, "", location.pathname); } catch (e) {}
    }
    if (!sb) return Promise.resolve();
    sb.auth.onAuthStateChange(function (event) {
      /* 이 콜백 안에서 바로 서버를 부르면 멈출 수 있어 다음 틱으로 미룬다 */
      setTimeout(function () { if (event === "PASSWORD_RECOVERY") openAuth("reset"); loadMe(); }, 0);
    });
    return loadMe().then(function () {
      if (hadCode) {
        /* 이메일 인증을 마치고 돌아오면 항상 메인(홈)으로 간다(비밀번호 재설정 창은 그대로 둔다) */
        try { history.replaceState(null, "", location.pathname); } catch (e) {}
        if (!document.getElementById("auth-modal")) { try { route(); } catch (e) {} }
        setTimeout(function () { if (me && !document.getElementById("auth-modal")) toast("이메일 인증이 끝났어요. 로그인되었어요."); }, 400);
      }
    });
  }

<style>
/* 레이아웃: 한 줄 기둥. 위에서부터 채널 → 에피소드 → 재생 시계(상단 고정) → 댓글 흐름, 댓글 입력은 하단 고정.

:root {
  --st: env(safe-area-inset-top, 0px);   /* 상단 안전 영역. 홈 화면 앱(주소창 없음)에서는 아래에서 조금 더 준다 */

  --font: "Pretendard Variable", Pretendard, system-ui, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
  --mono: "Pretendard Variable", Pretendard, system-ui, -apple-system, "Apple SD Gothic Neo", sans-serif;   /* 시간·순위 숫자: 같은 글꼴에 자리 맞춤(tabular) 숫자 */
}

    --sig: #FFD000; --on-sig: #14161B; --mark: #4A4210; --dim: rgba(0, 0, 0, .6);
    --brand: #F3F3F0; --brand-fg: #0F1013; --brand-soft: #22232A;
    --rec: #FFD000; --rec-text: #F3F3F0; --mask: #26272E; --err: #FF8A80;

  }
}
:root[data-theme="dark"] {
  --bg: #0F1013; --surface: #17181D; --fg: #F3F3F0; --muted: #9A9CA5; --line: #26272E; --soft: #22232A; --bar: #3A3C45;
  --sig: #FFD000; --on-sig: #14161B; --mark: #4A4210; --dim: rgba(0, 0, 0, .6);
  --brand: #F3F3F0; --brand-fg: #0F1013; --brand-soft: #22232A;

}

  padding-block: 0 24px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
/* 상태바 아래가 시스템에 의해 흐려지는 화면(아이폰 홈 화면 앱)에서는 앱 전체를 위에서 --st 아래에서 시작하는 고정 스크롤 영역에 담는다.
   덮개로 가리는 방식이 아니라 스크롤 영역 자체가 그 아래에서 시작해, 내용이 위 --st 구간으로 올라가지 않는다. (일반 브라우저는 그대로 페이지 스크롤) */
html.framed, html.framed body { height: 100%; overflow: hidden; padding: 0; }

  padding: 0 max(16px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }

* { box-sizing: border-box; touch-action: manipulation; }   /* 빈 곳을 두 번 눌러도 확대되지 않게 */
html { -webkit-text-size-adjust: 100%; }
html, body { touch-action: manipulation; }
a { color: inherit; }
.wrap { max-width: 640px; margin: 0 auto; }
.top { display: flex; flex-direction: column; align-items: stretch; padding: 8px 0 6px; }   /* 1줄: 해/달 버튼·로그인 정보, 2줄: 제목 */

  @keyframes hl-draw { from { background-size: 0% 100%; } to { background-size: 100% 100%; } }
}   /* '사이' 밑줄(형광펜) */

.brand.bk .chev { flex: none; color: inherit; position: relative; top: 1px; }   /* 글자와 같은 색, 세로 중심은 글자에 맞춰 1px 내림(측정값) */

.lede { margin: 4px 0 20px; color: var(--muted); }

@media (prefers-reduced-motion: no-preference) { .liveline::before { animation: breathe 2.4s ease-in-out infinite; } @keyframes breathe { 50% { box-shadow: 0 0 0 7px color-mix(in srgb, var(--sig) 10%, transparent); } } }
.rank { margin: 28px 0 32px; }   /* 아래 여백: 순위표와 에피소드 목록 사이 */
.rank:empty { display: none; }
.rkh { display: flex; align-items: center; gap: 8px; font-size: 17px; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 12px; }   /* 제목 옆 노란 거북이: 이 순위에 들면 닉네임 옆에 이 거북이가 붙는다 */
.rkh .trk { position: relative; flex: 1; min-width: 0; height: 26px; }
.rkh .trk .tur { position: absolute; left: 0; top: 2px; width: 22px; height: 22px; }
.rkh .trk.done .tur { left: calc(100% - 22px); }
@media (prefers-reduced-motion: no-preference) {
  .rkh .trk.walk .tur { animation: walk 14s cubic-bezier(.35, .1, .5, 1) both, bob 1s ease-in-out 14 alternate; }   /* 아주 느리게 걷고, 걸음마다 1px만 까딱 */
  @keyframes walk { from { left: 0; } to { left: calc(100% - 22px); } }

  @keyframes stepS { 0%, 50%, 100% { transform: rotate(0); } 25% { transform: rotate(-11deg); } 75% { transform: rotate(11deg); } }
  .rkh .trk.walk .tur.siot .lg.a { transform-origin: 100% 0; }

}

      if (cr.data !== "ok") return fail(why[cr.data] || "처리하지 못했어요. 잠시 뒤 다시 시도해 주세요.");
      await loadMe();
      if (sess && sess.poll) sess.poll(true);   /* 지난 댓글의 닉네임도 바로 새로 읽는다 */
      closeAuth(); toast("닉네임을 바꿨어요.");
    } else if (m === "reset") {
      if (pw.length < 8) return fail("비밀번호는 8자 이상으로 해 주세요.");
      r = await sb.auth.updateUser({ password: pw });
      if (r.error) return fail(authMsg(r.error));
      closeAuth(); toast("비밀번호를 바꿨어요.");
    }
  }
  function sbSendError(e) {
    var m = String((e && (e.message || e.details)) || "");
    if (/too_fast/.test(m)) return "조금 천천히 남겨 주세요. 5초에 한 번만 쓸 수 있어요.";
    if (/no_profile/.test(m)) return "프로필이 없어요. 운영자에게 알려 주세요.";
    if (/row-level security|permission denied|jwt|not authenticated/i.test(m) || (e && (e.code === "42501" || e.status === 401))) return "로그인이 필요해요. 다시 로그인해 주세요.";
    if (/check constraint|violates/i.test(m)) return "댓글 내용이나 시각을 확인해 주세요.";
    return "보내지 못했어요. 다시 눌러 주세요.";
  }

  /* ---- 댓글 조회(몇 초마다). 앞으로 나올 댓글은 서버가 보내지 않는다 ---- */
  function startPolling(S) {
    S.map = {}; S.afterId = 0; S.prevUpto = -1; S.extra = 0; S.total = 0; S.polls = 0; S.lastFull = 0;
    function norm(c) { return { id: c.id, sec: c.sec, text: c.body, nick: c.nickname, host: !!c.is_host, parent: c.parent_id || null, replyTo: c.reply_to_nick || "", mine: !!c.mine, edited: !!c.edited, badge: !!c.badge }; }
    async function poll(full) {
      if (sess !== S) return;
      if (S.polling) { S.again = true; if (full) S.wantFull = true; return; }
      S.polling = true; S.lastPollAt = Date.now();
      try {
        var upto = S.reveal ? 43200 : Math.min(43200, Math.ceil(pos()) + NEAR + 5);
        if (!full && Date.now() - S.lastFull > 45000) full = true;   /* 가끔 전체를 다시 받아 삭제된 댓글을 반영 */
        var args = full ? { p_ep: S.key, p_upto: upto, p_after_id: 0, p_prev_upto: -1 }
                        : { p_ep: S.key, p_upto: upto, p_after_id: S.afterId, p_prev_upto: S.prevUpto };
        var r = await sb.rpc("list_comments", args);
        if (sess !== S) return;
        if (r.error) throw r.error;
        var old = S.map;
        if (full) { S.map = {}; S.afterId = 0; S.lastFull = Date.now(); }
        r.data.forEach(function (c) {
          var n = norm(c), o = old[c.id];
          if (o && (o.text !== n.text || o.edited !== n.edited || o.nick !== n.nick || o.host !== n.host || o.mine !== n.mine)) S.rev = (S.rev || 0) + 1;
          S.map[c.id] = n; if (c.id > S.afterId) S.afterId = c.id;
        });
        S.prevUpto = full ? upto : Math.max(S.prevUpto, upto);
        S.comments = Object.keys(S.map).map(function (k) { return S.map[k]; }).sort(function (a, b) { return a.sec - b.sec || a.id - b.id; });
        S.loadState = "ok";
        S.extra = 0;
        S.polls++;
        renderMarks(); renderFeed(false);
      } catch (e) {
        if (sess === S && S.loadState !== "ok") { S.loadState = "error"; renderFeed(true); }
      } finally { S.polling = false; if (S.again && sess === S) { S.again = false; setTimeout(function () { var f = !!S.wantFull; S.wantFull = false; poll(f); }, 300); } }
    }
    S.poll = poll;
    poll(true);
    /* 새 댓글이 올라오면 서버가 '신호'만 보낸다(내용 없음). 신호를 받으면 바로 다시 조회한다. */
    var kickAt = 0, kickTimer = null, kickFull = false;
    function run() { var f = kickFull; kickFull = false; kickAt = Date.now(); poll(f); }
    function kick(full) {
      if (full) kickFull = true;   /* 수정·삭제 신호는 전체를 다시 받아야 반영된다 */
      var wait = 1500 - (Date.now() - kickAt);   /* 신호가 몰려도 1.5초에 한 번만 조회 */
      if (wait <= 0) run();
      else if (!kickTimer) kickTimer = setTimeout(function () { kickTimer = null; run(); }, wait);
    }
    try {
      S.rt = sb.channel("ep:" + S.key, { config: { broadcast: { self: false } } })
        .on("broadcast", { event: "comment" }, function (m) { var op = m && m.payload && m.payload.op; kick(!!op && op !== "INSERT"); })
        .subscribe(function (status) { S.rtOk = (status === "SUBSCRIBED"); });
    } catch (e) { S.rtOk = false; }
    /* 실시간 연결이 되어 있으면 30초마다 확인만, 안 되어 있으면 4초마다 조회 */
    S.pollTimer = setInterval(function () {
      if (document.hidden) return;
      var gap = S.rtOk ? 30000 : 4000;
      if (Date.now() - (S.lastPollAt || 0) >= gap - 300) poll(false);
    }, 1000);
  }

  /* 시계는 setInterval 횟수가 아니라 실제 시각(Date.now)에서 계산한다.
     화면이 꺼져 타이머가 멈춰도 돌아오는 순간 정확한 위치로 따라잡는다. */
  document.addEventListener("visibilitychange", function () {
    if (document.hidden) { if (sess && sess.audio) savePos(sess, true); }
    else { tick(); if (sess && sess.poll) sess.poll(false); }
  });
  addEventListener("pagehide", function () { if (sess && sess.audio) savePos(sess, true); });
  addEventListener("pageshow", function () { tick(); });
  addEventListener("focus", function () { tick(); });
  function onScroll() { if (sess) sess.follow = nearBottom(); }
  addEventListener("scroll", onScroll, { passive: true });
  document.getElementById("scroller").addEventListener("scroll", onScroll, { passive: true });
  /* 상단 여백: 아이폰 상단(상태바 아래 약 12%)은 시스템이 흐리게 처리한다(캡처로 확인).
     안전 영역(상태바 높이)이 있는 화면(주소창 없는 웹앱)에서만 윗 12% 높이까지 비운다.
     CSS 계산식은 이 폰의 웹앱에서 적용되지 않아, 안전 영역을 직접 재서 --st 에 넣는다. */
  function applySafeTop() {
    try {
      var probe = document.createElement("div");
      probe.style.cssText = "position:fixed;top:0;left:0;width:1px;height:1px;visibility:hidden;pointer-events:none;padding-top:env(safe-area-inset-top, 0px)";
      document.body.appendChild(probe);
      var inset = parseFloat(getComputedStyle(probe).paddingTop) || 0;
      probe.remove();
      /* 홈 화면 앱(navigator.standalone)인데 안전 영역을 못 읽으면(0) 아이폰 상태바 높이 59 로 본다 */
      if (!inset && window.navigator.standalone === true) inset = 59;
      /* 사용자 폰 실측(2026-11-17): '웹 앱으로 열기'는 페이지 영역이 이미 상태바 아래에서 시작한다(화면 852, 페이지 높이 793 = 852-59).
         그런데도 안전 영역은 59 로 알려 줘서 그대로 더하면 상태바 높이가 두 번 들어간다(캡처에서 로그인 줄이 화면 180pt).
         이때는 위쪽 일부만 비우면 된다: 50px 는 흐림 없음·너무 아래라는 사용자 확인으로 30px 로 줄였다(2026-11-17).
         페이지가 상태바 밑까지 올라가는 화면이면(높이 = 화면 높이) 안전 영역+흐림 구간(윗 12%)까지 비운다. */
      var screenH = (window.screen && window.screen.height) || 0;
      var below = inset > 0 && screenH > 0 && (screenH - window.innerHeight) >= inset - 2;
      var st = !inset ? 0 : (below ? 30 : Math.max(inset + 14, Math.round(window.innerHeight * 0.12)));
      document.documentElement.style.setProperty("--st", st + "px");
      document.documentElement.classList.toggle("framed", st > 0);   /* 위 --st 아래에서 시작하는 고정 스크롤 영역 사용 여부 */
    } catch (e) {}
  }
  applySafeTop();
  /* 빈 곳을 빠르게 두 번 누르면 아이폰이 확대한다: 두 번째 누름의 기본 동작을 막는다(버튼·링크·입력칸 등 누를 수 있는 곳은 제외해 빠른 연속 누르기는 그대로 동작) */
  var lastTouchEnd = 0;
  document.addEventListener("touchend", function (e) {
    var now = Date.now();
    if (now - lastTouchEnd <= 350 && e.cancelable && !(e.target.closest && e.target.closest("button, a, input, textarea, select, label, [role=button], .seek"))) e.preventDefault();
    lastTouchEnd = now;
  }, { passive: false });
  addEventListener("orientationchange", function () { setTimeout(applySafeTop, 300); });
  addEventListener("pageshow", applySafeTop);
  /* ---- 새 버전 알아채기 ----
     사이트가 새로 배포되면 열어 둔 앱도 스스로 새 화면으로 바꾼다. 앱으로 돌아올 때·10분마다 version.txt 를 확인하고,
     달라졌으면 '재생 중이 아니고, 글 쓰는 중이 아니고, 창이 열려 있지 않을 때'(=방해되지 않을 때) 다시 불러온다. */
  var BUILD_ID = "__BUILD_ID__", newBuild = "";
  function updateIdle() {
    var S = sess, ae = document.activeElement;
    var playing = !!(S && ((S.audio && !S.audio.paused) || (S.clock && S.clock.playing)));
    var typing = !!ae && (ae.tagName === "INPUT" || ae.tagName === "TEXTAREA");
    return !playing && !typing && !document.getElementById("auth-modal") && !(S && (S.editing || S.sending));
  }
  function applyUpdate() {
    if (!newBuild || !updateIdle()) return;
    try { if (sess && sess.audio) savePos(sess, true); } catch (e) {}
    try { sessionStorage.setItem("ds_upd", newBuild); } catch (e) {}   /* 같은 버전으로 다시 불러오기를 되풀이하지 않게 */
    location.reload();
  }
  function checkUpdate() {
    if (!SITE || BUILD_ID.charAt(0) === "_" || location.protocol === "file:") return;
    fetch("version.txt?x=" + Date.now(), { cache: "no-store" }).then(function (r) { return r.ok ? r.text() : ""; }).then(function (t) {
      t = (t || "").trim();
      if (!/^[0-9a-f]{6,40}$/.test(t) || t === BUILD_ID) return;
      var tried = ""; try { tried = sessionStorage.getItem("ds_upd") || ""; } catch (e) {}
      if (tried === t) return;
      newBuild = t; applyUpdate();
    }).catch(function () {});
  }
  document.addEventListener("visibilitychange", function () { if (!document.hidden) setTimeout(checkUpdate, 600); });
  addEventListener("pageshow", function () { setTimeout(checkUpdate, 600); });
  setInterval(function () { if (!document.hidden) checkUpdate(); }, 600000);
  setInterval(function () { if (newBuild && !document.hidden) applyUpdate(); }, 15000);
  watchKeyboard();
  addEventListener("hashchange", route);
  route();
  ready.then(function () { if (sess) updateComposer(); });
})();
</script>

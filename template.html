<title>듣는 사이</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* 레이아웃: 한 줄 기둥. 위에서부터 채널 → 에피소드 → 재생 시계(상단 고정) → 댓글 흐름, 댓글 입력은 하단 고정.
   색: 바탕·글자는 조용한 잉크 톤, 형광펜 노랑(--sig) 한 가지만 '지금 여기'(재생 위치·주요 버튼·접속 점·순위 밑줄·거북이)에 쓴다.
   밝게/어둡게: 기본은 기기 설정, 사용자가 해/달 버튼으로 고르면 data-theme 에 저장해 따른다. */
:root {
  --st: env(safe-area-inset-top, 0px);   /* 상단 안전 영역. 홈 화면 앱(주소창 없음)에서는 아래에서 조금 더 준다 */
  --bg: #FAFAF9; --surface: #FFFFFF; --fg: #14161B; --muted: #6A6E78; --line: #E8E8E4; --soft: #F0F0EC; --bar: #D9D9D3;
  --sig: #FFD000; --on-sig: #14161B; --mark: #FFE45C; --dim: rgba(20, 22, 27, .45);
  --brand: #14161B; --brand-fg: #FAFAF9; --brand-soft: #F0F0EC;   /* 옛 이름(글자색 강조=잉크). 조작 색은 --sig */
  --rec: #FFD000; --rec-text: #14161B; --mask: #ECECE8; --err: #B3261E;
  --wall: #F3F1EA; --floor: #E9E6DB; --seat: #D9D5C7; --stage: #EFEBDD;   /* 공개방송 무대 */
  --font: "Pretendard Variable", Pretendard, system-ui, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
  --mono: "Pretendard Variable", Pretendard, system-ui, -apple-system, "Apple SD Gothic Neo", sans-serif;   /* 시간·순위 숫자: 같은 글꼴에 자리 맞춤(tabular) 숫자 */
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1013; --surface: #17181D; --fg: #F3F3F0; --muted: #9A9CA5; --line: #26272E; --soft: #22232A; --bar: #3A3C45;
    --sig: #FFD000; --on-sig: #14161B; --mark: #4A4210; --dim: rgba(0, 0, 0, .6);
    --brand: #F3F3F0; --brand-fg: #0F1013; --brand-soft: #22232A;
    --rec: #FFD000; --rec-text: #F3F3F0; --mask: #26272E; --err: #FF8A80;
    --wall: #1A1B20; --floor: #14151A; --seat: #2A2B33; --stage: #22232A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1013; --surface: #17181D; --fg: #F3F3F0; --muted: #9A9CA5; --line: #26272E; --soft: #22232A; --bar: #3A3C45;
  --sig: #FFD000; --on-sig: #14161B; --mark: #4A4210; --dim: rgba(0, 0, 0, .6);
  --brand: #F3F3F0; --brand-fg: #0F1013; --brand-soft: #22232A;
  --rec: #FFD000; --rec-text: #F3F3F0; --mask: #26272E; --err: #FF8A80;
  --wall: #1A1B20; --floor: #14151A; --seat: #2A2B33; --stage: #22232A;
  color-scheme: dark;
}
body {
  background: var(--bg); color: var(--fg); font: 15px/1.6 var(--font); word-break: keep-all;
  padding-block: 0 24px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
/* 상태바 아래가 시스템에 의해 흐려지는 화면(아이폰 홈 화면 앱)에서는 앱 전체를 위에서 --st 아래에서 시작하는 고정 스크롤 영역에 담는다.
   덮개로 가리는 방식이 아니라 스크롤 영역 자체가 그 아래에서 시작해, 내용이 위 --st 구간으로 올라가지 않는다. (일반 브라우저는 그대로 페이지 스크롤) */
html.framed, html.framed body { height: 100%; overflow: hidden; padding: 0; }
html.framed #scroller { position: fixed; top: var(--st); right: 0; bottom: 0; left: 0; overflow-x: hidden; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior-y: contain;
  padding: 0 max(16px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
html.framed .top { padding-top: 0; }
html.playing, html.playing body { overscroll-behavior-y: none; }   /* 재생 중에는 아래로 당겨 새로고침(재생이 멈춤)되지 않게 */
* { box-sizing: border-box; touch-action: manipulation; }   /* 빈 곳을 두 번 눌러도 확대되지 않게 */
html { -webkit-text-size-adjust: 100%; }
html, body { touch-action: manipulation; }
a { color: inherit; }
.wrap { max-width: 640px; margin: 0 auto; }
.top { display: flex; flex-direction: column; align-items: stretch; padding: 8px 0 6px; }   /* 1줄: 해/달 버튼·로그인 정보, 2줄: 제목 */
.tools { display: flex; align-items: center; justify-content: flex-end; gap: 8px; min-height: 40px; }
.tgl { flex: none; width: 40px; height: 40px; padding: 0; border-radius: 50%; border: 0; background: none; color: var(--muted); display: inline-grid; place-items: center; cursor: pointer; -webkit-tap-highlight-color: transparent; }   /* 조용한 아이콘(테두리 없음). 누르는 영역은 40px */
.tgl:active { background: var(--soft); color: var(--fg); }
.tgl svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.top > .brand { align-self: flex-start; }
.brand { font: 900 38px/1.1 var(--font); text-decoration: none; letter-spacing: -0.045em; }
.brand em { font-style: normal; background: linear-gradient(transparent 56%, var(--sig) 56%, var(--sig) 92%, transparent 92%) no-repeat 0 0 / 100% 100%; padding: 0 2px; margin: 0 -2px; }   /* 밝게·어둡게 똑같이 형광펜 밑줄 */
@media (prefers-reduced-motion: no-preference) {
  .brand.draw em { animation: hl-draw .9s cubic-bezier(.3, .1, .2, 1) .35s both; }   /* 첫 홈에서 한 번, 왼쪽→오른쪽으로 쓱 그어진다 */
  @keyframes hl-draw { from { background-size: 0% 100%; } to { background-size: 100% 100%; } }
}   /* '사이' 밑줄(형광펜) */
.brand.bk { display: inline-flex; align-items: center; min-height: 44px; min-width: 0; margin-left: -8px; padding-right: 8px; font-size: 16px; font-weight: 500; letter-spacing: -0.01em; }
.brand.bk .chev { flex: none; color: inherit; position: relative; top: 1px; }   /* 글자와 같은 색, 세로 중심은 글자에 맞춰 1px 내림(측정값) */
.brand.bk span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lede { margin: 4px 0 20px; color: var(--muted); }
.liveline { margin: -12px 0 18px; font-size: 14px; font-weight: 500; color: var(--fg); }
.liveline:empty { display: none; }
.liveline::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--sig); box-shadow: 0 0 0 4px color-mix(in srgb, var(--sig) 30%, transparent); margin-right: 10px; vertical-align: 0; }
@media (prefers-reduced-motion: no-preference) { .liveline::before { animation: breathe 2.4s ease-in-out infinite; } @keyframes breathe { 50% { box-shadow: 0 0 0 7px color-mix(in srgb, var(--sig) 10%, transparent); } } }
.rank { margin: 28px 0 32px; }   /* 아래 여백: 순위표와 에피소드 목록 사이 */
.rank:empty { display: none; }
.rkh { display: flex; align-items: center; gap: 8px; font-size: 17px; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 12px; }   /* 제목 옆 노란 거북이: 이 순위에 들면 닉네임 옆에 이 거북이가 붙는다 */
.rkh .trk { position: relative; flex: 1; min-width: 0; height: 26px; }
.rkh .trk .tur { position: absolute; left: 0; top: 2px; width: 22px; height: 22px; }
.rkh .trk.done .tur { left: calc(100% - 22px); }
@media (prefers-reduced-motion: no-preference) {
  .rkh .trk.walk .tur { animation: walk 30s cubic-bezier(.35, .1, .5, 1) both, bob 1.5s ease-in-out 20 alternate; }   /* 엉금엉금: 30초에 걸쳐 걷고, 걸음마다 1px만 까딱 */
  @keyframes walk { from { left: 0; } to { left: calc(100% - 22px); } }
  @keyframes bob { from { transform: translateY(0); } to { transform: translateY(-1px); } }
  /* 아장아장: 앞다리·뒷다리가 엇갈려 앞뒤로 흔들리고 살짝 들린다(걷는 30초 동안만, 끝나면 제자리 0도) */
  .rkh .trk.walk .tur .lg { transform-box: fill-box; transform-origin: 50% 0; animation: step 2s ease-in-out 15; }
  .rkh .trk.walk .tur .lg.b { animation-delay: -1s; }
  .rkh .trk.walk .tur.siot { animation: walk 30s cubic-bezier(.35, .1, .5, 1) both, hop 1.2s ease-in-out 25 alternate; }   /* 말풍선은 통통 튀며 */
  @keyframes hop { from { transform: translateY(0); } to { transform: translateY(-3px); } }
  @keyframes step { 0%, 50%, 100% { transform: rotate(0) translateY(0); } 25% { transform: rotate(-24deg) translateY(-.5px); } 75% { transform: rotate(24deg) translateY(-.5px); } }
}
.rkh .trk.walk .tur { left: calc(100% - 22px); }   /* 움직임이 허용되면 위 애니메이션이 0에서 출발, 끝나면 이 자리에 선다 */
.rkg { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.rk { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 14px 14px 10px; min-width: 0; }
.rkt { font-size: 12px; font-weight: 500; color: var(--muted); margin-bottom: 6px; }
.rk ol { list-style: none; margin: 0; padding: 0; }
.rk li { display: grid; grid-template-columns: 16px minmax(0, 1fr); gap: 8px; align-items: center; padding: 6px 0; font-size: 14.5px; }
.rk .no { font: 500 12px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.rk .nm { min-width: 0; overflow-wrap: anywhere; font-weight: 500; line-height: 1.3; }
.rk li:first-child .nm span { background: linear-gradient(transparent 58%, var(--mark) 58%); padding: 0 2px; margin: 0 -2px; }
.adm-sum { margin: 8px 0 2px; font-size: 16px; font-weight: 700; }
.adm-live { font-size: 13px; color: var(--muted); }
.adm-list { margin-top: 12px; max-height: 46vh; overflow-y: auto; border-top: 1px solid var(--line); }
.adm-row { display: flex; gap: 8px; align-items: baseline; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.adm-row .nm { font-weight: 500; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.adm-row .rl { font-size: 12px; color: var(--fg); font-weight: 500; white-space: nowrap; }
.adm-row .mt { margin-left: auto; font-size: 12px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
h1, h2 { margin: 0; font-weight: 900; letter-spacing: -0.03em; text-wrap: balance; }
.btn { min-height: 44px; padding: 0 16px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); font: 500 15px var(--font); cursor: pointer; }
.btn.pri { background: var(--sig); border-color: var(--sig); color: var(--on-sig); font-weight: 700; }
.btn:disabled { opacity: .45; cursor: default; }
.btn.link { border: 0; background: none; min-height: 36px; padding: 0 6px; color: var(--fg); font-weight: 500; text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1.5px; }
.btn:focus-visible, .chip:focus-visible, a:focus-visible, .tgl:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
input:focus-visible { outline: none; border-color: var(--fg) !important; box-shadow: 0 0 0 3px color-mix(in srgb, var(--sig) 45%, transparent); }
input[type=text], input[type=email], input[type=password] { width: 100%; min-height: 48px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); border-radius: 14px; padding: 0 14px; font: 16px var(--font); }
input:disabled { opacity: .55; }
/* ---- 홈: 프로그램이 화면을 가득 채우는 반반 패널(폰에서는 좌우 끝까지) ---- */
.home { display: flex; flex-direction: column; min-height: calc(100svh - var(--st, 0px) - 24px - env(safe-area-inset-bottom, 0px)); }
.hgrid { flex: 1; display: grid; gap: 0; min-height: 420px; }
.hp { position: relative; display: flex; flex-direction: column; justify-content: flex-end; padding: 22px 20px 20px; overflow: hidden; text-decoration: none; color: var(--fg); background: var(--soft); min-height: 264px; }
.hp.fx { color: #14161B; }
.hp .hn { margin: 0; max-width: 58%; font-size: 36px; font-weight: 900; letter-spacing: -0.04em; line-height: 1.1; }
.hp .hl { margin: 0 0 8px; max-width: 58%; font-size: 14px; line-height: 1.3; font-weight: 600; opacity: .78; }   /* 진행자 줄: 이름 위. 시즌 줄은 줄 간격을 좁게 */
.hp .hs { margin: 8px 0 0; max-width: 58%; font-size: 14px; line-height: 20px; opacity: .78; overflow-wrap: anywhere; }
.hp .hx { position: absolute; right: 22px; bottom: 20px; margin: 0; text-align: right; font-size: 12.5px; line-height: 20px; opacity: .66; font-variant-numeric: tabular-nums; }   /* 오른쪽 아래(로고 오른쪽 끝에 맞춰 우측정렬), 왼쪽 글의 마지막 줄과 같은 아랫선 */
.hp .hl span { display: block; }
.hp .art { position: absolute; right: 22px; top: 28px; width: 134px; height: 134px; border-radius: 28px; object-fit: cover; box-shadow: 0 10px 28px rgba(0, 0, 0, .14); background: var(--surface); display: grid; place-items: center; font-weight: 800; font-size: 34px; color: var(--muted); }
.hp:focus-visible { outline: 3px solid var(--fg); outline-offset: -3px; }
@media (max-width: 640px) { .hgrid { margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px))) calc(-1 * max(16px, env(safe-area-inset-right, 0px))); } }
@media (min-width: 641px) { .hgrid { gap: 12px; } .hp { border-radius: 28px; min-height: 280px; } }
@media (max-width: 360px) { .hp .art { width: 106px; height: 106px; border-radius: 23px; } .hp .hn { font-size: 30px; } }
.list { display: flex; flex-direction: column; }
.ch { display: grid; grid-template-columns: 64px minmax(0, 1fr) 18px; gap: 14px; align-items: center; padding: 14px 0; border-top: 1px solid var(--line); text-decoration: none; }
.ch:last-child { border-bottom: 1px solid var(--line); }
.ch > svg { color: var(--muted); justify-self: end; }
.cv { flex: none; width: 64px; height: 64px; border-radius: 16px; object-fit: cover; background: var(--soft); border: 1px solid var(--line); display: grid; place-items: center; font-weight: 700; color: var(--muted); }
.cv.lg { width: 88px; height: 88px; border-radius: 22px; }
.chm { min-width: 0; }
.chn { font-weight: 700; font-size: 18px; letter-spacing: -0.02em; line-height: 1.25; }
.chs { color: var(--muted); font-size: 13.5px; line-height: 1.4; overflow-wrap: anywhere; margin-top: 2px; }
.chx { color: var(--muted); font-size: 12px; margin-top: 6px; font-variant-numeric: tabular-nums; }
.foot { margin: 24px 0 0; color: var(--muted); font-size: 13px; }
.chhead { display: flex; gap: 16px; align-items: center; margin: 8px 0 16px; }
.chstick { position: sticky; top: 0; z-index: 6; background: var(--bg); }
.chstick .sec { border-bottom: 1px solid var(--line); }
.chstick + .er { border-top: 0; }
.links { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 8px; }
.links a { display: inline-flex; align-items: center; min-height: 36px; padding: 0 12px; border: 1px solid var(--line); border-radius: 18px; background: var(--surface); font-size: 14px; text-decoration: none; }
.links.sm { gap: 4px 16px; margin: 8px 0 0; }
.links.sm a { min-height: 32px; padding: 0; border: 0; background: none; border-radius: 0; text-decoration: underline; color: var(--muted); }
.er { display: grid; grid-template-columns: 44px 1fr; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); text-decoration: none; }
.er .n { font: 400 13px/1.8 var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.er .et { font-weight: 500; overflow-wrap: anywhere; }
.er .em { color: var(--muted); font-size: 13px; }
.back { display: inline-block; margin: 4px 0 8px; color: var(--muted); text-decoration: none; font-size: 14px; min-height: 32px; }
.eph { margin: 0 0 14px; }
.eph h1 { font-size: 21px; line-height: 1.35; }
.eph .em { color: var(--muted); font-size: 13px; margin-top: 4px; }
.sync { position: sticky; top: 0; z-index: 5; background: none; border: 0; border-radius: 0; padding: 0; }
.sync .sh { font-size: 16px; }
.hint { margin: 4px 0 12px; color: var(--muted); font-size: 14px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px; }
.tform { display: flex; gap: 8px; margin-top: 10px; }
.tform input { flex: 1; min-width: 0; }
.err { color: var(--err); font-size: 13px; margin-top: 6px; min-height: 0; }
.err:empty { display: none; }
.clock { font: 700 44px/1 var(--mono); color: var(--fg); letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
.clock small { font-size: 16px; color: var(--muted); font-weight: 500; letter-spacing: 0; }
.bar { position: relative; height: 32px; margin: 8px 0 0; }
.bar .wv { position: absolute; inset: 0; display: flex; align-items: flex-end; gap: 2px; pointer-events: none; }
.bar .wv i { flex: 1; min-height: 4px; border-radius: 2px; background: var(--bar); }
.bar .wv i.on { background: var(--fg); }   /* 들은 만큼은 진하게, 높이는 댓글이 몰린 정도 */
.bar .fill { display: none; }
.bar .dot { position: absolute; top: -3px; bottom: -3px; width: 3px; margin-left: -1.5px; border-radius: 2px; background: var(--sig); box-shadow: 0 0 0 2px var(--bg); left: 0; pointer-events: none; }
.bar .mk { display: none; }
.ctrl { display: flex; gap: 6px; margin-top: 6px; }
.ctrl .btn { flex: 1 1 0; min-width: 0; padding: 0 8px; }
.sec { margin: 18px 0 0; }
.sec .lb { font-size: 13px; color: var(--muted); margin-bottom: 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { min-height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); font: 500 14px var(--font); cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--fg); border-color: var(--fg); color: var(--bg); }
.fhead { display: grid; grid-template-columns: auto 36px; justify-content: start; align-items: center; gap: 6px; margin: 0; padding: 8px 0; border-bottom: 1px solid var(--line); }   /* 선 아래부터 댓글이 스크롤. 구간 선택은 가운데 */
.seg { display: inline-flex; padding: 3px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); }
.seg button { min-height: 34px; padding: 0 14px; border: 0; border-radius: 999px; background: none; color: var(--muted); font: 500 13.5px var(--font); cursor: pointer; }
.seg button.upto { display: inline-flex; align-items: center; gap: 4px; }
.seg button.upto svg { width: 15px; height: 15px; flex: none; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; margin-left: -3px; }
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
.note { color: var(--muted); font-size: 14px; padding: 14px 0; overflow-wrap: anywhere; }
.note .btn.link { font-size: 14px; }
.cm { display: grid; grid-template-columns: var(--tw, 52px) minmax(0, 1fr) auto; gap: 14px;   /* 시각 칸 폭(--tw)은 방송 길이에 맞춘다: 1시간 넘으면 '1:12:30' 이 들어가도록 넓힘 */
   padding: 14px 0; border-top: 1px solid var(--line); }
.cm .t { font: 500 12.5px/1.9 var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }

         이때는 위쪽 일부만 비우면 된다: 50px 는 흐림 없음·너무 아래라는 사용자 확인으로 30px 로 줄였다(2026-11-17).
         페이지가 상태바 밑까지 올라가는 화면이면(높이 = 화면 높이) 안전 영역+흐림 구간(윗 12%)까지 비운다. */
      var screenH = (window.screen && window.screen.height) || 0;
      var below = inset > 0 && screenH > 0 && (screenH - window.innerHeight) >= inset - 2;
      var st = !inset ? 0 : (below ? 30 : Math.max(inset + 14, Math.round(window.innerHeight * 0.12)));
      document.documentElement.style.setProperty("--st", st + "px");
      document.documentElement.classList.toggle("framed", st > 0);   /* 위 --st 아래에서 시작하는 고정 스크롤 영역 사용 여부 */
    } catch (e) {}
  }
  applySafeTop();
  /* 빈 곳을 빠르게 두 번 누르면 아이폰이 확대한다: 두 번째 누름의 기본 동작을 막는다(버튼·링크·입력칸 등 누를 수 있는 곳은 제외해 빠른 연속 누르기는 그대로 동작) */
  var lastTouchEnd = 0;
  document.addEventListener("touchend", function (e) {
    var now = Date.now();
    if (now - lastTouchEnd <= 350 && e.cancelable && !(e.target.closest && e.target.closest("button, a, input, textarea, select, label, [role=button], .seek"))) e.preventDefault();
    lastTouchEnd = now;
  }, { passive: false });
  addEventListener("orientationchange", function () { setTimeout(applySafeTop, 300); });
  addEventListener("pageshow", applySafeTop);
  /* ---- 새 버전 알아채기 ----
     사이트가 새로 배포되면 열어 둔 앱도 스스로 새 화면으로 바꾼다. 앱으로 돌아올 때·10분마다 version.txt 를 확인하고,
     달라졌으면 '재생 중이 아니고, 글 쓰는 중이 아니고, 창이 열려 있지 않을 때'(=방해되지 않을 때) 다시 불러온다. */
  var BUILD_ID = "__BUILD_ID__", newBuild = "";
  function updateIdle() {
    var S = sess, ae = document.activeElement;
    var playing = !!(S && ((S.audio && !S.audio.paused) || (S.clock && S.clock.playing)));
    var typing = !!ae && (ae.tagName === "INPUT" || ae.tagName === "TEXTAREA");
    return !playing && !typing && !document.getElementById("auth-modal") && !(S && (S.editing || S.sending));
  }
  function applyUpdate() {
    if (!newBuild || !updateIdle()) return;
    try { if (sess && sess.audio) savePos(sess, true); } catch (e) {}
    try { sessionStorage.setItem("ds_upd", newBuild); } catch (e) {}   /* 같은 버전으로 다시 불러오기를 되풀이하지 않게 */
    location.reload();
  }
  function checkUpdate() {
    if (!SITE || BUILD_ID.charAt(0) === "_" || location.protocol === "file:") return;
    fetch("version.txt?x=" + Date.now(), { cache: "no-store" }).then(function (r) { return r.ok ? r.text() : ""; }).then(function (t) {
      t = (t || "").trim();
      if (!/^[0-9a-f]{6,40}$/.test(t) || t === BUILD_ID) return;
      var tried = ""; try { tried = sessionStorage.getItem("ds_upd") || ""; } catch (e) {}
      if (tried === t) return;
      newBuild = t; applyUpdate();
    }).catch(function () {});
  }
  document.addEventListener("visibilitychange", function () { if (!document.hidden) setTimeout(checkUpdate, 600); });
  addEventListener("pageshow", function () { setTimeout(checkUpdate, 600); });
  setInterval(function () { if (!document.hidden) checkUpdate(); }, 600000);
  setInterval(function () { if (newBuild && !document.hidden) applyUpdate(); }, 15000);
  watchKeyboard();
  addEventListener("hashchange", route);
  route();
  ready.then(function () { if (sess) updateComposer(); });
})();
</script>

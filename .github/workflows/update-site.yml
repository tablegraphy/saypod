# 새 방송 자동 반영: 10분마다 RSS를 읽어 사이트를 다시 만들어 깃허브 페이지에 배포한다.
# 공개 저장소(tablegraphy/saypod)의 .github/workflows/update-site.yml 로 올려서 쓴다.
# 올릴 때 깃허브 도구(gh)에 workflow 권한이 필요하다(2026-11-17 승인됨).
# 같은 폴더의 build.py·template.html·channels.json·privacy.json·config.json·cache/·icon-180.png 도 저장소 맨 위에 있어야 한다.
name: 사이트 갱신 (새 방송 반영)
on:
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"
    # 거북목 라디오는 매월 2·4번째 목요일 오전 5시(한국)에 올라온다. 그날 05:00~06:59 에는 3분마다 확인한다(수요일 20:00~21:59 UTC).
    # 2·4번째 목요일이 아닌 주에는 아래 gate 단계가 건너뛴다. 사이시옷은 올라오는 시각이 불규칙해서 위 10분 간격이 맡는다.
    - cron: "*/3 20-21 * * 3"
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.g.outputs.run }}
    steps:
      - id: g
        run: |
          run=true
          if [ "${{ github.event.schedule }}" = "*/3 20-21 * * 3" ]; then
            d=$(TZ=Asia/Seoul date +%-d)
            nth=$(( (d - 1) / 7 + 1 ))
            if [ "$nth" != "2" ] && [ "$nth" != "4" ]; then run=false; fi
            echo "한국 날짜 ${d}일 = ${nth}번째 목요일, 실행: $run"
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
  build:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: 새 방송 이미지 축소용 Pillow
        run: pip install pillow==11.3.0
      - name: 방송 목록을 읽어 사이트 만들기
        run: |
          python build.py --site-only --out _site
          cp icon-180.png _site/
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

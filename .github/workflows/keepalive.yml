# 출입만 하는 자동 실행: Supabase 무료 프로젝트가 일주일 동안 활동이 없어 멈추지 않게, 하루 두 번 가벼운 조회 요청만 보낸다.
# 사이트를 만들거나 배포하지 않고, 아무것도 쓰거나 고치지 않는다(읽기 전용 요청 2개). 사이트와 별개로 돈다.
# 공개 저장소(tablegraphy/saypod)의 .github/workflows/keepalive.yml 로 올려서 쓴다.
# 대상: ① 듣는 사이(config.json 의 주소·공개 키, 댓글 목록 조회 함수) ② 사이사이(공개용 키만 쓰며, 아래 keepalive 함수가 생기기 전에는 '없음' 안내만 하고 실패로 치지 않는다).
# 사이사이용 함수는 데이터베이스에 한 번 만들어 둔다: 3. 사이사이/ 의 SQL 참고.
# 메모: 이 요청이 Supabase 의 '활동'으로 세어지는지는 공식 문서에 적혀 있지 않아 미확인이다. 대시보드의 사용량 화면에서 요청이 잡히는지 확인한다.
name: 출입만 하는 자동 실행 (프로젝트 깨우기)
on:
  schedule:
    - cron: "17 6,18 * * *"   # 매일 15:17, 03:17 (한국 시각)
  workflow_dispatch:
permissions: {}
concurrency:
  group: keepalive
  cancel-in-progress: false
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: config.json
          sparse-checkout-cone-mode: false
      - name: 듣는 사이 (댓글 목록을 한 번 읽기)
        run: |
          URL=$(python3 -c "import json;print(json.load(open('config.json'))['supabase']['url'])")
          KEY=$(python3 -c "import json;print(json.load(open('config.json'))['supabase']['key'])")
          code=$(curl -s -m 20 --retry 2 -o /dev/null -w "%{http_code}" -X POST "$URL/rest/v1/rpc/list_comments" \
            -H "apikey: $KEY" -H "Content-Type: application/json" -d '{"p_ep":"keepalive-0"}')
          echo "듣는 사이 응답: $code"
          test "$code" = "200"
      - name: 사이사이 (가벼운 함수를 한 번 부르기)
        if: ${{ !cancelled() }}
        run: |
          URL="https://zoyufmawgmjzltykhbdl.supabase.co"
          KEY="sb_publishable_0Blcnfa2_UnzeZ2zNx6K6g_MD2sODTc"
          code=$(curl -s -m 20 --retry 2 -o /dev/null -w "%{http_code}" -X POST "$URL/rest/v1/rpc/keepalive" \
            -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}')
          echo "사이사이 응답: $code"
          if [ "$code" = "404" ]; then
            echo "::warning::사이사이에 keepalive 함수가 아직 없습니다(404). SQL 을 한 번 실행해 두세요."
          else
            test "$code" = "200"
          fi

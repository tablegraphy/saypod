<style>
/* 레이아웃: 한 줄 기둥. 위에서부터 채널 → 에피소드 → 재생 시계(상단 고정) → 댓글 흐름, 댓글 입력은 하단 고정.
   색: 차가운 슬레이트 바탕 + 청록(조작) + 녹음등 주황(지금 시각, 이 페이지에서 가장 튀는 한 곳) */
:root {
  --bg: #F2F4F6; --surface: #FFFFFF; --fg: #121C26; --muted: #5B6B7A; --line: #DCE2E8;
  --brand: #17707A; --brand-fg: #FFFFFF; --brand-soft: #E1F0F1;
  --rec: #D8431F; --rec-text: #B93514; --mask: #E3E8EC; --err: #B3261E;
  --font: "Noto Sans KR", system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1419; --surface: #161E26; --fg: #E8EEF3; --muted: #93A3B2; --line: #2A3642;
    --brand: #5CC2CC; --brand-fg: #07161A; --brand-soft: #12353A;
    --rec: #FF6A45; --rec-text: #FF8566; --mask: #25303A; --err: #FF8A80;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1419; --surface: #161E26; --fg: #E8EEF3; --muted: #93A3B2; --line: #2A3642;
  --brand: #5CC2CC; --brand-fg: #07161A; --brand-soft: #12353A;
  --rec: #FF6A45; --rec-text: #FF8566; --mask: #25303A; --err: #FF8A80;
  color-scheme: dark;
}
body {
  background: var(--bg); color: var(--fg); font: 15px/1.6 var(--font); word-break: keep-all;
  padding-block: 0 24px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
* { box-sizing: border-box; }
a { color: inherit; }
.wrap { max-width: 640px; margin: 0 auto; }
.top { display: flex; align-items: center; justify-content: space-between; padding: 16px 0 8px; }
.brand { font: 700 27px/1.1 var(--font); text-decoration: none; letter-spacing: -0.03em; }
.lede { margin: 4px 0 20px; color: var(--muted); }
.lede span { display: block; }
h1, h2 { margin: 0; font-weight: 700; text-wrap: balance; }
.btn { min-height: 44px; padding: 0 16px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); font: 500 15px var(--font); cursor: pointer; }
.btn.pri { background: var(--brand); border-color: var(--brand); color: var(--brand-fg); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.link { border: 0; background: none; min-height: 36px; padding: 0 6px; color: var(--brand); text-decoration: underline; }
.btn:focus-visible, .chip:focus-visible, input:focus-visible, a:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
input[type=text], input[type=email], input[type=password] { width: 100%; min-height: 44px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); border-radius: 10px; padding: 0 12px; font: 16px var(--font); }
input:disabled { opacity: .55; }
.list { display: flex; flex-direction: column; gap: 10px; }
.ch { display: flex; gap: 14px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; text-decoration: none; }
.cv { flex: none; width: 64px; height: 64px; border-radius: 10px; object-fit: cover; background: var(--brand-soft); display: grid; place-items: center; font-weight: 700; color: var(--brand); }
.cv.lg { width: 88px; height: 88px; }
.chm { min-width: 0; }
.chn { font-weight: 700; font-size: 17px; }
.chs { color: var(--muted); font-size: 14px; overflow-wrap: anywhere; }
.chx { color: var(--muted); font-size: 13px; margin-top: 2px; }
.foot { margin: 24px 0 0; color: var(--muted); font-size: 13px; }
.chhead { display: flex; gap: 16px; align-items: center; margin: 8px 0 16px; }
.links { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 8px; }
.links a { display: inline-flex; align-items: center; min-height: 36px; padding: 0 12px; border: 1px solid var(--line); border-radius: 18px; background: var(--surface); font-size: 14px; text-decoration: none; }
.links.sm { gap: 4px 16px; margin: 8px 0 0; }
.links.sm a { min-height: 32px; padding: 0; border: 0; background: none; border-radius: 0; text-decoration: underline; color: var(--muted); }
.er { display: grid; grid-template-columns: 44px 1fr; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); text-decoration: none; }
.er .n { font: 500 14px/1.7 var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.er .et { font-weight: 500; overflow-wrap: anywhere; }
.er .em { color: var(--muted); font-size: 13px; }
.back { display: inline-block; margin: 4px 0 8px; color: var(--muted); text-decoration: none; font-size: 14px; min-height: 32px; }
.eph { margin: 0 0 14px; }
.eph h1 { font-size: 21px; line-height: 1.35; }
.eph .em { color: var(--muted); font-size: 13px; margin-top: 4px; }
.sync { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
.sync .sh { font-size: 16px; }
.hint { margin: 4px 0 12px; color: var(--muted); font-size: 14px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px; }
.tform { display: flex; gap: 8px; margin-top: 10px; }
.tform input { flex: 1; min-width: 0; }
.err { color: var(--err); font-size: 13px; margin-top: 6px; min-height: 0; }
.err:empty { display: none; }
.clock { font: 600 38px/1 var(--mono); color: var(--rec-text); letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.clock small { font-size: 16px; color: var(--muted); font-weight: 500; letter-spacing: 0; }
.bar { position: relative; height: 24px; margin: 8px 0 0; }
.bar::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 4px; margin-top: -2px; background: var(--line); border-radius: 2px; }
.bar .fill { position: absolute; left: 0; top: 50%; height: 4px; margin-top: -2px; background: var(--rec); border-radius: 2px; width: 0; }
.bar .dot { position: absolute; top: 50%; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; background: var(--rec); left: 0; }
.bar .mk { position: absolute; top: 3px; bottom: 3px; width: 2px; margin-left: -1px; background: var(--brand); opacity: .6; border-radius: 1px; }
.ctrl { display: flex; gap: 6px; margin-top: 6px; }
.ctrl .btn { flex: 1 1 0; min-width: 0; padding: 0 8px; }
.sec { margin: 18px 0 0; }
.sec .lb { font-size: 13px; color: var(--muted); margin-bottom: 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { min-height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); font: 500 14px var(--font); cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--brand-soft); border-color: var(--brand); color: var(--brand); }
.fhead { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; margin: 22px 0 6px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface); }
.seg button { min-height: 40px; padding: 0 14px; border: 0; background: none; color: var(--muted); font: 500 14px var(--font); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--brand-soft); color: var(--brand); }
.note { color: var(--muted); font-size: 14px; padding: 14px 0; overflow-wrap: anywhere; }
.note .btn.link { font-size: 14px; }
.cm { display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
.cm .t { font: 500 14px/1.7 var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.cm.near .t { color: var(--rec-text); }
.cm .who { font-size: 13px; color: var(--muted); }
.cm .who b { color: var(--fg); font-weight: 500; }
.cm .who .host { display: inline-block; margin-left: 4px; vertical-align: -2px; color: var(--brand); }
.cm .who .listener { display: inline-block; margin-left: 4px; vertical-align: -2px; color: var(--muted); }
.cm .tx { overflow-wrap: anywhere; white-space: pre-wrap; }
.mask { display: inline-block; height: 14px; width: min(70%, 220px); background: var(--mask); border-radius: 4px; margin-top: 4px; }
.del { min-height: 32px; padding: 0 8px; border: 0; background: none; color: var(--muted); font: 13px var(--font); cursor: pointer; text-decoration: underline; }
.pad { height: 150px; }
.comp { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line);
  padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.comp .in { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 4px; }
.comp form { display: flex; gap: 8px; }
.comp form input { flex: 1; min-width: 0; }
.comp .meta { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 2px 12px; }
.comp .meta .tform { flex: 1 1 100%; }
.comp .nk { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
.comp .nk b { color: var(--fg); font-weight: 500; }
.stamp { font: 500 12px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.stamp.on { color: var(--rec-text); }
.seg.full { display: flex; width: 100%; margin: 0 0 10px; }
.seg.full button { flex: 1; }
.bar .seek { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; -webkit-appearance: none; appearance: none; background: transparent; }
.bar .seek::-webkit-slider-thumb { -webkit-appearance: none; width: 2px; height: 24px; }
.bar .seek::-moz-range-thumb { width: 2px; height: 24px; border: 0; }
.top { gap: 12px; }
.authbar { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); min-width: 0; }
.authbar b { color: var(--fg); font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 9em; }
.authbar .nickbtn { border: 0; background: none; padding: 0; font: inherit; font-weight: 500; color: var(--fg); cursor: pointer; text-decoration: underline dotted; text-underline-offset: 3px; max-width: 9em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.authbar .host { color: var(--brand); flex: none; }
.authbar .listener { color: var(--muted); flex: none; }
.authbar .btn { min-height: 36px; padding: 0 12px; font-size: 14px; }
.authbar .btn.link { padding: 0 6px; }
.modal { position: fixed; inset: 0; z-index: 40; background: rgba(8, 14, 20, .55); display: grid; place-items: end center; padding: 16px; padding-bottom: max(16px, env(safe-area-inset-bottom, 0px)); overflow-y: auto; }
.modal .card { width: 100%; max-width: 420px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px; }
.modal h2 { font-size: 18px; margin-bottom: 2px; }
.modal label { display: block; font-size: 13px; color: var(--muted); margin: 14px 0 4px; }
.modal .row2 { margin-top: 16px; }
.modal .row2 .btn { width: 100%; }
.modal .row { gap: 4px 8px; margin-top: 8px; }
.okmsg { color: var(--brand); font-size: 14px; margin-top: 10px; line-height: 1.5; }
.okmsg:empty { display: none; }
.fine { font-size: 12px; color: var(--muted); margin: 12px 0 0; line-height: 1.5; }
.toast { position: fixed; top: calc(68px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); z-index: 50; background: var(--fg); color: var(--bg); padding: 10px 14px; border-radius: 10px; font-size: 14px; max-width: calc(100% - 32px); text-align: center; }

.consent { margin-top: 14px; padding: 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); font-size: 13px; line-height: 1.55; }
.consent .ct { font-weight: 700; margin-bottom: 4px; }
.consent ul { margin: 0 0 6px; padding-left: 18px; }
.consent a { color: var(--brand); }
.modal .consent .chk { display: flex; gap: 8px; align-items: flex-start; margin: 8px 0 0; font-size: 14px; color: var(--fg); }
.consent .chk input { margin-top: 3px; width: 18px; height: 18px; flex: none; }
.policy h1 { font-size: 22px; margin: 8px 0 4px; }
.policy h2 { font-size: 16px; margin: 22px 0 6px; }
.policy p, .policy li { font-size: 14px; line-height: 1.7; margin: 0 0 8px; overflow-wrap: anywhere; }
.policy ul { padding-left: 20px; margin: 0 0 8px; }
.foot a { color: var(--muted); }
.stick { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 6; background: var(--bg); padding: 6px 0 12px; margin: 0; box-shadow: 0 10px 10px -10px rgba(0, 0, 0, .25); }
.stick .hd { display: flex; gap: 12px; align-items: center; margin-bottom: 8px; }
.stick .th { flex: none; border-radius: 8px; object-fit: cover; background: var(--brand-soft); }
.stick .th.wide { width: 112px; height: 63px; }
.stick .th.sq { width: 72px; height: 72px; }
.stick .hdm { min-width: 0; }
.stick .hdm .back { margin: 0; min-height: 0; font-size: 12px; display: block; }
.stick .hdm h1 { font-size: 15px; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; margin: 2px 0 0; }
.stick .hdm .em { color: var(--muted); font-size: 12px; margin-top: 2px; }
.stick .sync { position: static; padding: 8px 12px; }
.stick .prow { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.stick .clock.sm { font-size: 30px; }
.stick .ctrl.sm { margin: 0; flex: none; gap: 6px; }
.stick .ctrl.sm .btn { flex: none; min-width: 0; min-height: 40px; padding: 0 10px; font-size: 14px; }
.stick .ctrl.sm .btn.pri { min-width: 60px; }
.stick .bar { margin: 6px 0 0; }
.stick .tot { text-align: right; font: 500 11px var(--mono); color: var(--muted); margin-top: 2px; }
.stick .hint { margin: 2px 0 0; font-size: 12px; }
.stick.compact .hd, .stick.compact .sync .bar, .stick.compact .sync .ctrl, .stick.compact .sync .hint, .stick.compact .sync .tot { display: none; }
@media (max-height: 620px) { .stick .th { display: none; } }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }

      var agree1 = el("input", { type: "checkbox", id: "auth-agree" }), agree2 = el("input", { type: "checkbox", id: "auth-age" });
      var titles = { login: "로그인", signup: "가입", forgot: "비밀번호 찾기", reset: "새 비밀번호", nick: "닉네임 변경" };
      var go = el("button", { class: "btn pri", type: "submit", text: { login: "로그인", signup: "가입하기", forgot: "메일 보내기", reset: "비밀번호 바꾸기", nick: "변경하기" }[m] });
      var busy = false;
      if (m === "nick" && me) nick.value = me.nick || "";
      function fail(t) { msg.textContent = t; ok.textContent = ""; }
      function link(t, to) { return el("button", { class: "btn link", type: "button", text: t, onclick: function () { draw(to); } }); }
      var form = el("form", { novalidate: true, onsubmit: async function (e) {
        e.preventDefault(); if (busy) return;
        busy = true; go.disabled = true; msg.textContent = ""; ok.textContent = "";
        try { await submitAuth(m, email.value.trim(), pw.value, nick.value.trim(), fail, ok, { agree: agree1.checked, age: agree2.checked }); }
        catch (x) { fail(authMsg(x)); }
        finally { busy = false; go.disabled = false; }
      } },
        (m === "reset" || m === "nick") ? null : field("이메일", email),
        (m === "forgot" || m === "nick") ? null : field(m === "reset" ? "새 비밀번호 (8자 이상)" : (m === "signup" ? "비밀번호 (8자 이상)" : "비밀번호"), pw),
        (m === "signup" || m === "nick") ? field(m === "nick" ? "새 닉네임 (한글·영문·숫자·밑줄, 단어 사이 띄어쓰기 1칸, 12자까지)" : "닉네임 (한글·영문·숫자·밑줄, 단어 사이 띄어쓰기 1칸, 12자까지 · 공개돼요)", nick) : null,
        m === "signup" ? el("div", { class: "consent" },
          el("div", { class: "ct", text: "개인정보 수집·이용 동의 (필수)" }),
          el("ul", null,
            el("li", { text: "수집 항목: 이메일, 비밀번호, 닉네임" }),
            el("li", { text: "이용 목적: 회원 가입·로그인, 댓글 서비스, 비밀번호 찾기, 이어듣기 저장" }),
            el("li", { text: "보유 기간: 회원 탈퇴 때까지(이어듣기 위치는 마지막 저장 후 30일)" }),
            el("li", { text: "동의를 거부할 수 있어요. 거부하면 가입과 댓글 쓰기가 제한되고, 듣기와 댓글 읽기는 가입 없이 할 수 있어요." })),
          (D && D.privacy) ? el("a", { href: "#privacy", target: "_blank", rel: "noopener", text: "개인정보 처리방침 전문 보기" }) : null,
          el("label", { class: "chk" }, agree1, " 개인정보 수집·이용에 동의합니다. (필수)"),
          el("label", { class: "chk" }, agree2, " 만 14세 이상입니다. (필수)")) : null,
        el("div", { class: "row2" }, go), msg, ok);
      put(card, el("h2", { text: titles[m] }), form,
        m === "nick" ? el("p", { class: "fine", text: "바꾸면 지금까지 남긴 댓글의 닉네임도 함께 바뀌어요. 일반 사용자는 24시간에 한 번만 바꿀 수 있어요." }) : null,
        m === "signup" ? el("p", { class: "fine", text: "받는 정보는 이메일·비밀번호·닉네임뿐이에요. 이메일은 로그인과 비밀번호 찾기에만 쓰고 공개하지 않아요." }) : null,
        el("div", { class: "row" },
          m === "login" ? [link("가입하기", "signup"), link("비밀번호를 잊으셨나요?", "forgot")] : ((m === "reset" || m === "nick") ? null : link("로그인으로", "login")),
          el("button", { class: "btn link", type: "button", text: "닫기", onclick: closeAuth })));
      var first = card.querySelector("input");
      if (first) setTimeout(function () { first.focus(); }, 50);
    }
  }
  async function submitAuth(m, email, pw, nick, fail, ok, consent) {
    if (!sb) return fail("로그인 기능을 불러오지 못했어요.");
    var r;
    if (m === "login") {
      r = await sb.auth.signInWithPassword({ email: email, password: pw });
      if (r.error) return fail(authMsg(r.error));
      closeAuth(); toast("로그인했어요.");
    } else if (m === "signup") {
      if (!(consent && consent.agree && consent.age)) return fail("필수 동의 항목에 체크해 주세요.");
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return fail("이메일 주소를 확인해 주세요.");
      if (pw.length < 8) return fail("비밀번호는 8자 이상으로 해 주세요.");
      if (!nickOk(nick)) return fail(NICK_RULE);
      var a = await sb.rpc("nickname_available", { p_nick: nick });
      if (a.error) return fail(authMsg(a.error));
      if (a.data === "taken") return fail("이미 사용 중인 닉네임이에요. 다른 이름을 써 주세요.");
      if (a.data === "reserved") return fail("이 닉네임은 쓸 수 없어요. 다른 이름을 써 주세요.");
      if (a.data !== "ok") return fail("닉네임 형식을 확인해 주세요.");
      r = await sb.auth.signUp({ email: email, password: pw, options: { data: { nickname: nick, consent_privacy: (D && D.privacy ? D.privacy.version : ""), age14: true }, emailRedirectTo: location.origin + location.pathname } });
      if (r.error) return fail(authMsg(r.error));
      if (r.data && r.data.user && r.data.user.identities && r.data.user.identities.length === 0) return fail("이미 가입된 이메일이에요. 로그인해 주세요.");
      ok.textContent = "확인 메일을 보냈어요. 메일의 링크를 누른 뒤 로그인해 주세요. 메일이 안 보이면 스팸함도 확인해 주세요.";
    } else if (m === "forgot") {
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return fail("이메일 주소를 확인해 주세요.");
      r = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname });
      if (r.error && (r.error.status === 429 || /rate limit/i.test(r.error.message || ""))) return fail(authMsg(r.error));
      ok.textContent = "입력한 이메일로 가입된 계정이 있다면 비밀번호를 바꾸는 링크를 보냈어요. 메일이 안 보이면 스팸함도 확인해 주세요.";
    } else if (m === "nick") {
      if (!nickOk(nick)) return fail(NICK_RULE);
      var cr = await sb.rpc("change_nickname", { p_nick: nick });
      if (cr.error) return fail(authMsg(cr.error));
      var why = { taken: "이미 사용 중인 닉네임이에요. 다른 이름을 써 주세요.", reserved: "이 닉네임은 쓸 수 없어요. 다른 이름을 써 주세요.", invalid: NICK_RULE,
                  too_soon: "닉네임은 24시간에 한 번만 바꿀 수 있어요.", not_authenticated: "다시 로그인해 주세요.", no_profile: "프로필이 없어요. 운영자에게 알려 주세요." };
      if (cr.data !== "ok") return fail(why[cr.data] || "처리하지 못했어요. 잠시 뒤 다시 시도해 주세요.");
      await loadMe();
      if (sess && sess.poll) sess.poll(true);   /* 지난 댓글의 닉네임도 바로 새로 읽는다 */
      closeAuth(); toast("닉네임을 바꿨어요.");
    } else if (m === "reset") {
      if (pw.length < 8) return fail("비밀번호는 8자 이상으로 해 주세요.");
      r = await sb.auth.updateUser({ password: pw });
      if (r.error) return fail(authMsg(r.error));
      closeAuth(); toast("비밀번호를 바꿨어요.");
    }
  }
  function sbSendError(e) {
    var m = String((e && (e.message || e.details)) || "");
    if (/too_fast/.test(m)) return "조금 천천히 남겨 주세요. 5초에 한 번만 쓸 수 있어요.";
    if (/no_profile/.test(m)) return "프로필이 없어요. 운영자에게 알려 주세요.";
    if (/row-level security|permission denied|jwt|not authenticated/i.test(m) || (e && (e.code === "42501" || e.status === 401))) return "로그인이 필요해요. 다시 로그인해 주세요.";
    if (/check constraint|violates/i.test(m)) return "댓글 내용이나 시각을 확인해 주세요.";
    return "보내지 못했어요. 다시 눌러 주세요.";
  }

  /* ---- 댓글 조회(몇 초마다). 앞으로 나올 댓글은 서버가 보내지 않는다 ---- */
  function startPolling(S) {
    S.map = {}; S.afterId = 0; S.prevUpto = -1; S.extra = 0; S.total = 0; S.polls = 0; S.lastFull = 0;
    function norm(c) { return { id: c.id, sec: c.sec, text: c.body, nick: c.nickname, host: !!c.is_host }; }
    async function poll(full) {
      if (sess !== S) return;
      if (S.polling) { S.again = true; return; }
      S.polling = true; S.lastPollAt = Date.now();
      try {
        var upto = S.reveal ? 43200 : Math.min(43200, Math.ceil(pos()) + NEAR + 5);
        if (!full && Date.now() - S.lastFull > 45000) full = true;   /* 가끔 전체를 다시 받아 삭제된 댓글을 반영 */
        var args = full ? { p_ep: S.key, p_upto: upto, p_after_id: 0, p_prev_upto: -1 }
                        : { p_ep: S.key, p_upto: upto, p_after_id: S.afterId, p_prev_upto: S.prevUpto };
        var r = await sb.rpc("list_comments", args);
        if (sess !== S) return;
        if (r.error) throw r.error;
        if (full) { S.map = {}; S.afterId = 0; S.lastFull = Date.now(); }
        r.data.forEach(function (c) { S.map[c.id] = norm(c); if (c.id > S.afterId) S.afterId = c.id; });
        S.prevUpto = full ? upto : Math.max(S.prevUpto, upto);
        S.comments = Object.keys(S.map).map(function (k) { return S.map[k]; }).sort(function (a, b) { return a.sec - b.sec || a.id - b.id; });
        S.loadState = "ok";
        S.extra = 0;
        S.polls++;
        renderMarks(); renderFeed(false);
      } catch (e) {
        if (sess === S && S.loadState !== "ok") { S.loadState = "error"; renderFeed(true); }
      } finally { S.polling = false; if (S.again && sess === S) { S.again = false; setTimeout(function () { poll(false); }, 300); } }
    }
    S.poll = poll;
    poll(true);
    /* 새 댓글이 올라오면 서버가 '신호'만 보낸다(내용 없음). 신호를 받으면 바로 다시 조회한다. */
    var kickAt = 0, kickTimer = null;
    function kick() {
      var wait = 1500 - (Date.now() - kickAt);   /* 신호가 몰려도 1.5초에 한 번만 조회 */
      if (wait <= 0) { kickAt = Date.now(); poll(false); }
      else if (!kickTimer) kickTimer = setTimeout(function () { kickTimer = null; kickAt = Date.now(); poll(false); }, wait);
    }
    try {
      S.rt = sb.channel("ep:" + S.key, { config: { broadcast: { self: false } } })
        .on("broadcast", { event: "comment" }, kick)
        .subscribe(function (status) { S.rtOk = (status === "SUBSCRIBED"); });
    } catch (e) { S.rtOk = false; }
    /* 실시간 연결이 되어 있으면 30초마다 확인만, 안 되어 있으면 4초마다 조회 */
    S.pollTimer = setInterval(function () {
      if (document.hidden) return;
      var gap = S.rtOk ? 30000 : 4000;
      if (Date.now() - (S.lastPollAt || 0) >= gap - 300) poll(false);
    }, 1000);
  }

  /* 시계는 setInterval 횟수가 아니라 실제 시각(Date.now)에서 계산한다.
     화면이 꺼져 타이머가 멈춰도 돌아오는 순간 정확한 위치로 따라잡는다. */
  document.addEventListener("visibilitychange", function () {
    if (document.hidden) { if (sess && sess.audio) savePos(sess, true); }
    else { tick(); if (sess && sess.poll) sess.poll(false); }
  });
  addEventListener("pagehide", function () { if (sess && sess.audio) savePos(sess, true); });
  addEventListener("pageshow", function () { tick(); });
  addEventListener("focus", function () { tick(); });
  addEventListener("scroll", function () {
    if (sess) sess.follow = (window.innerHeight + window.scrollY) >= document.documentElement.scrollHeight - 160;
  }, { passive: true });
  watchKeyboard();
  addEventListener("hashchange", route);
  route();
  ready.then(function () { if (sess) updateComposer(); });
})();
</script>
